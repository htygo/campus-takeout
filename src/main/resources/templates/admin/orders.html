<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('订单处理')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('admin')}"></nav>

<div class="container">

    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="admin-grid">
        <div th:replace="~{admin/admin-layout :: side('orders')}"></div>

        <div>
            <h2 style="font-size: 22px; font-weight: 800; margin-bottom: 18px;">📋 订单处理</h2>

            <div class="filter-bar">
                <a th:href="@{/admin/orders}"
                   th:classappend="${activeStatus == null} ? 'active' : ''">全部</a>
                <a th:each="s : ${statuses}"
                   th:href="@{/admin/orders(status=${s})}"
                   th:classappend="${activeStatus != null and activeStatus == s} ? 'active' : ''"
                   th:text="${s.label}">状态</a>
            </div>

            <div class="card">
                <table class="table" th:if="${!orders.isEmpty()}">
                    <thead>
                    <tr>
                        <th>订单号 / 时间</th>
                        <th>商品</th>
                        <th>金额</th>
                        <th>收货信息</th>
                        <th>状态</th>
                        <th style="width: 200px;">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="o : ${orders}">
                        <td>
                            <div class="fw-700" style="font-size: 13px;" th:text="${o.orderNo}">单号</div>
                            <div class="meta-small"
                                 th:text="${#temporals.format(o.createdAt, 'MM-dd HH:mm')}">时间</div>
                        </td>
                        <td style="max-width: 240px;">
                            <span th:each="it, stat : ${o.items}">
                                <span th:text="${it.dishName}">菜名</span> ×<span th:text="${it.quantity}">1</span><span
                                    th:if="${!stat.last}">、</span>
                            </span>
                            <div class="meta-small" th:if="${o.remark != null and !o.remark.isEmpty()}"
                                 th:text="'备注：' + ${o.remark}">备注</div>
                        </td>
                        <td class="fw-700" th:text="'¥' + ${#numbers.formatDecimal(o.totalAmount,1,2)}">¥0.00</td>
                        <td style="max-width: 200px; font-size: 13px;">
                            <div th:text="${o.phone}">电话</div>
                            <div class="meta-small" th:text="${o.address}">地址</div>
                        </td>
                        <td>
                            <span class="tag"
                                  th:classappend="${o.status.name() == 'COMPLETED'} ? 'tag-green'
                                                : (${o.status.name() == 'CANCELLED'} ? 'tag-gray'
                                                : (${o.status.name() == 'PAID'} ? 'tag-blue'
                                                : (${o.status.name() == 'DELIVERING'} ? 'tag-purple' : 'tag-orange')))"
                                  th:text="${o.status.label}">状态</span>
                        </td>
                        <td>
                            <div class="flex gap-8" style="flex-wrap: wrap;">
                                <form th:if="${o.status.name() == 'PAID'}"
                                      th:action="@{/admin/orders/{id}/advance(id=${o.id})}"
                                      method="post" class="inline-form">
                                    <button type="submit" class="btn btn-primary btn-sm">开始配送</button>
                                </form>

                                <form th:if="${o.status.name() == 'DELIVERING'}"
                                      th:action="@{/admin/orders/{id}/advance(id=${o.id})}"
                                      method="post" class="inline-form">
                                    <button type="submit" class="btn btn-success btn-sm">完成送达</button>
                                </form>

                                <form th:if="${o.status.name() != 'COMPLETED' and o.status.name() != 'CANCELLED'}"
                                      th:action="@{/admin/orders/{id}/cancel(id=${o.id})}"
                                      method="post" class="inline-form"
                                      onsubmit="return confirm('取消后将自动退款并回补库存，确定吗？')">
                                    <button type="submit" class="btn btn-danger btn-sm">取消订单</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <div class="empty" th:if="${orders.isEmpty()}">
                    <span class="emoji">📮</span>
                    <div>该状态下暂无订单</div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
