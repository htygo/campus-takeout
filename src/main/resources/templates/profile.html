<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('个人中心')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('')}"></nav>

<div class="container-sm">

    <div th:replace="~{fragments/layout :: flash}"></div>

    <!-- 账户概览 -->
    <div class="card" style="background: linear-gradient(120deg, #fff3ec, #ffe3d3); border: none;">
        <div class="flex-between" style="flex-wrap: wrap; gap: 16px;">
            <div class="flex-center gap-12">
                <div style="width: 56px; height: 56px; border-radius: 50%; background: #fff;
                            display: flex; align-items: center; justify-content: center; font-size: 28px;">
                    👤
                </div>
                <div>
                    <div style="font-size: 20px; font-weight: 800;" th:text="${user.displayName}">昵称</div>
                    <div class="muted" style="font-size: 13px;">
                        @<span th:text="${user.username}">username</span>
                        · 注册于 <span th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd')}">日期</span>
                        <span sec:authorize="hasRole('ADMIN')" class="tag tag-purple" style="margin-left: 6px;">管理员</span>
                    </div>
                </div>
            </div>
            <div sec:authorize="hasRole('USER')" style="text-align: right;">
                <div class="muted" style="font-size: 13px;">账户余额</div>
                <div style="font-size: 28px; font-weight: 800; color: var(--primary);"
                     th:text="'¥' + ${#numbers.formatDecimal(user.balance,1,2)}">¥0.00</div>
            </div>
        </div>
    </div>

    <!-- 充值 -->
    <div class="card" sec:authorize="hasRole('USER')">
        <div class="card-title">💰 余额充值</div>
        <form th:action="@{/me/recharge}" method="post" class="flex gap-8" style="flex-wrap: wrap;">
            <input type="number" name="amount" class="form-control" required min="0.01" step="0.01"
                   placeholder="输入充值金额" style="flex: 1; min-width: 180px;">
            <button type="submit" class="btn btn-primary">立即充值</button>
        </form>
        <div class="form-hint mt-8">演示用充值，点击后余额立即增加。</div>
    </div>

    <!-- 资料修改 -->
    <div class="card">
        <div class="card-title">📝 个人资料</div>
        <form th:action="@{/me/update}" method="post">
            <div class="form-group">
                <label>昵称</label>
                <input type="text" name="nickname" class="form-control" th:value="${user.nickname}">
            </div>
            <div class="form-group">
                <label>手机号</label>
                <input type="text" name="phone" class="form-control" th:value="${user.phone}">
            </div>
            <div class="form-group">
                <label>默认收货地址</label>
                <input type="text" name="address" class="form-control" th:value="${user.address}">
            </div>
            <button type="submit" class="btn btn-primary">保存资料</button>
        </form>
    </div>

    <!-- 修改密码 -->
    <div class="card">
        <div class="card-title">🔒 修改密码</div>
        <form th:action="@{/me/password}" method="post">
            <div class="form-group">
                <label>原密码</label>
                <input type="password" name="oldPassword" class="form-control" required>
            </div>
            <div class="form-group">
                <label>新密码</label>
                <input type="password" name="newPassword" class="form-control" required minlength="6">
            </div>
            <button type="submit" class="btn btn-outline">修改密码</button>
        </form>
    </div>

</div>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
